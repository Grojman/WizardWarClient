<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="face" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#fff4b8"/>
      <stop offset="0.45" stop-color="#f5c542"/>
      <stop offset="1" stop-color="#b8860b"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe98a"/>
      <stop offset="0.5" stop-color="#c9971c"/>
      <stop offset="1" stop-color="#7a5306"/>
    </linearGradient>
  </defs>
  <!-- Rim -->
  <circle cx="100" cy="100" r="96" fill="url(#rim)"/>
  <circle cx="100" cy="100" r="96" fill="none" stroke="#5c3d02" stroke-width="4"/>
  <!-- Face -->
  <circle cx="100" cy="100" r="80" fill="url(#face)"/>
  <circle cx="100" cy="100" r="80" fill="none" stroke="#8a6207" stroke-width="3"/>
  <circle cx="100" cy="100" r="70" fill="none" stroke="#a57a10" stroke-width="2" stroke-dasharray="4 6"/>
  <!-- Star emblem -->
  <polygon
    points="100,48 113,84 151,84 120,106 132,143 100,120 68,143 80,106 49,84 87,84"
    fill="#d9a520" stroke="#7a5306" stroke-width="4" stroke-linejoin="round"/>
  <polygon
    points="100,62 108,86 133,86 113,100 121,125 100,110"
    fill="#fff2a8" opacity="0.55"/>
  <!-- Shine -->
  <path d="M52 70 A55 55 0 0 1 90 40" fill="none" stroke="#ffffff" stroke-width="6"
    stroke-linecap="round" opacity="0.6"/>
</svg>
