<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <!-- Top-down dragon silhouette, flying toward the right -->
  <g fill="#000000">
    <!-- Upper wing: leading edge on the right, scalloped trailing edge on the left -->
    <path d="M 365 188
             C 390 130, 380 70, 335 12
             Q 318 55, 290 48
             Q 292 88, 258 90
             Q 262 125, 228 128
             Q 238 160, 232 190 Z"/>
    <!-- Lower wing (mirror of the upper one) -->
    <path d="M 365 212
             C 390 270, 380 330, 335 388
             Q 318 345, 290 352
             Q 292 312, 258 310
             Q 262 275, 228 272
             Q 238 240, 232 210 Z"/>
    <!-- Body -->
    <ellipse cx="330" cy="200" rx="125" ry="27"/>
    <!-- Neck and head -->
    <path d="M 430 187
             Q 470 180, 505 184
             L 520 176 L 518 186
             L 558 194 L 580 200 L 558 206
             L 518 214 L 520 224 L 505 216
             Q 470 220, 430 213 Z"/>
    <!-- Hind legs -->
    <path d="M 250 180 L 232 158 L 222 162 L 238 186 Z"/>
    <path d="M 250 220 L 232 242 L 222 238 L 238 214 Z"/>
    <!-- Tail -->
    <path d="M 215 189
             C 150 184, 110 228, 45 214
             L 45 224
             C 112 242, 152 213, 215 211 Z"/>
    <!-- Spade tail tip -->
    <path d="M 52 219 L 18 198 L 26 219 L 18 240 Z"/>
  </g>
</svg>
