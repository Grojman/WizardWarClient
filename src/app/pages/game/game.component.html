<div class="game-layout">
  <div class="table-container" #viewport
  (mousedown)="onMouseDown($event)"
  [class.reverse]="gameState.Rivals.length === 1"
  >
  <div class="player-slot me"
  #playerboard
  >
  <app-player
  [player]="gameState.Me"
  [visibleHand]="true"
  [isAnimating]="isAnimating"
  (onDeckSelected)="deckSelected()"
  (onCardRightClick)="onRightClick($event.event, $event.card)"
  (onDockSelected)="dockSelected($event)"
  (onAttackingUnitSelected)="attackingUnitSelected($event)"
  (onLastSpellClicked)="lastSpellClicked()"
  (onCardSelected)="cardSelected($event)"
  (onTargetSelected)="targetSel()"
  [selectedCard]="selectedCard"
  [unitSelected]="unitSelected"
  [attackingUnit]="attackingUnit"
  [showTarget]="gameState.Rivals.length !== 1"
  [long]="gameState.Rivals.length !== 1"
  
  >
</app-player>
</div>
<!-- Rivales -->
<div
class="player-slot rival"
*ngFor="let player of gameState.Rivals; let i = index"
>
<app-player
[player]="player"
[visibleHand]="false"
[isAnimating]="isAnimating"
[attackingUnit]="attackingUnit"
[showHealthAsTarget]="attackingUnit !== null"
(onCardRightClick)="onRightClick($event.event, $event.card)"
(onDockSelected)="rivalBoardCardSelected(player, player.Board[$event])"
(onPlayerTargetSelected)="rivalTargetSelected(player)"
[showTarget]="gameState.Rivals.length !== 1"
[long]="gameState.Rivals.length !== 1"
[reverseOrder]="gameState.Rivals.length === 1"
>
</app-player>
</div>
</div>


<div class="animation-layer">
  <div class="proyectile" style="display: none;">
    
  </div>
  
  <div class="icon-hand" style="display: none;"></div>
  <div class="icon-hand-card" style="display: none;"></div>
  <div class="icon-hand-wrench" style="display: none;"></div>
</div>
</div>

<div class="action-buttons">
  <p class="turn-text">
    <span>
      Turno: {{ gameState.CurrentTurn }}
    </span>
    
    <span *ngIf="gameState.CurrentTurn % 2 !== 0" 
    title="Al acabar este turno, todos los jugadores roban una carta"
    >
    <i class="fa-solid fa-copy"></i>
    <i class="fa-solid fa-plus"></i>
  </span>
  
</p>


<button class="notification-button btn btn-gold btn-action" (click)="openChat()">
  <i class="fa-solid fa-comments"></i>

  <p class="notification-counter"
  *ngIf="unreadNotificationCounter !== 0"
  >
  {{ unreadNotificationCounter }}
</p>
</button>
<button
class="btn btn-gold btn-action"
(click)="openSettings()"
>
<i class="fa-solid fa-gear"></i>
</button>
<button class="btn btn-gold btn-action" (click)="openHelp()">
  <i class="fa-solid fa-question"></i>
</button>
</div>
<div class="disconnect-banner" *ngIf="opponentDisconnected">
  <i class="fa-solid fa-triangle-exclamation"></i>
  <span>{{ getPlayer(opponentDisconnected.playerId).Name }} se ha desconectado. Finalizando la partida en {{ secondsRemaining }}s si no vuelve...</span>
</div>

<div class="winner-overlay">
  <div #winnerboard class="winner-board">
    <p>
      <span class="winner-name">Jugador 1</span>
      es el ganador y le deben una cerveza.
    </p>
    
    <button class="btn btn-gold btn-action" (click)="leaveGame()">Aceptar</button>
  </div>
</div>

<app-game-card-check
#gamecheck
>

</app-game-card-check>

<app-chat
#chat
(onMessageSent)="onMessageSent($event)"
>

</app-chat>

<app-settings
#settings
>

</app-settings>

<app-help
#helpwindow
>

</app-help>

<app-alert-modal
#errorModal
(closed)="onErrorClosed()"
>

</app-alert-modal>

<div class="rotate-phone overlay-backdrop">
  <div>
    <i class="fa-solid fa-rotate"></i>
    <i class="fa-solid fa-mobile-screen"></i>
  </div>
  
  <p>
    Por favor, rota tu teléfono para jugar
  </p>
</div>
