<div class="help-window overlay-backdrop" (click)="close()" *ngIf="isOpen">
    <div class="help-container panel" (click)="$event.stopPropagation()">
        
    <div class="help-header">
        <h2 class="title">LISTADO DE ACCIONES</h2>

        <button (click)="close()" class="btn-icon">x</button>
    </div>



    <div class="actions-container">

        <div
        *ngFor="let help of videos"
        >
            <p class="text">{{ help.title }}</p>
            <video 
            src='{{ help.source }}'
            class="gray"
            alt="" 
            (mouseenter)="this.playVideo($event)"
            (mouseleave)="this.stopVideo($event)"
            loop></video>
            <hr class="divider">
        </div>

    </div>

    </div>


</div>
