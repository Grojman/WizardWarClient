<div
  class="deck"
  [class.unavailable]="unavailable"
>
<div
[class.small]="small"
[class.selected]="selected"
    class="deck-image"
    [attr.data-game-id]="gameId"
    [ngStyle]="{
      'background-image': 'url(' + getImagePath() + ')'
    }"
    [title]="deck.name ? (deck.name | translate) : null"
    (mouseenter)="onImageHover()"
  >
    <span class="descriptiontext"
    #tooltip
    [class.up]="infoUp"
    >
      <p
      *ngIf="deck.description !== ''"
      >
        {{ deck.description }}
      </p>
      <p
      *ngIf="deck.cardAmount || showEmptyCount"
      >
        {{ 'DECK_SECTION_CARDS' | translate }} {{ deck.cardAmount }}
      </p>
    </span>
  </div>
  <p class="deck-name"
  *ngIf="deck.name"
  >
    {{ deck.name | translate }}
  </p>
  <div class="deck-difficulty"
  *ngIf="showDifficulty && deck.difficulty"
  role="img"
  [title]="('DECK_DIFFICULTY_LABEL' | translate) + ' ' + ('DECK_DIFFICULTY_' + deck.difficulty | translate)"
  [attr.aria-label]="('DECK_DIFFICULTY_LABEL' | translate) + ' ' + ('DECK_DIFFICULTY_' + deck.difficulty | translate)"
  >
    <span
    *ngFor="let level of difficultyLevels"
    class="difficulty-icon"
    [class.filled]="level <= deck.difficulty"
    ></span>
  </div>
</div>
