<!-- settings.component.html -->

<div class="settings-container overlay-backdrop" (click)="close()" *ngIf="isOpen">
  <div class="settings-panel" (click)="$event.stopPropagation()">
    <div class="settings-header">
      <span class="title">{{ 'SETTINGS_TITLE' | translate }}</span>

      <button class="close-btn btn-icon" type="button" (click)="close()">
        ✕
      </button>
    </div>
    
    <div class="settings-content">

      <!-- Language -->
      <div class="setting-group">
        <label class="setting-label">{{ 'SETTINGS_LANGUAGE' | translate }}</label>

        <div class="speed-options">
          <button
            *ngFor="let l of languages"
            class="speed-btn"
            [class.active]="l.code === languageService.getLanguage()"
            (click)="changeLanguage(l.code)"
          >
            {{ l.label }}
          </button>
        </div>
      </div>

      <!-- Animation Speed -->
      <div class="setting-group">
        <label class="setting-label">{{ 'SETTINGS_ANIMATION_SPEED' | translate }}</label>
        <p class="current-speed">{{ 'SETTINGS_CURRENT_LABEL' | translate }} {{ getCurrentSpeedLabel() }}</p>

        <div class="speed-options">
          <button
            *ngFor="let option of speedOptions"
            class="speed-btn"
            [class.active]="option.value === currentSpeedMultiplier"
            (click)="changeSpeed(option.value)"
            [title]="option.description"
          >
            {{ option.label }}
          </button>
        </div>
      </div>

      <!-- Music -->
      <div class="setting-group">
        <label class="setting-label">{{ 'SETTINGS_MUSIC' | translate }}</label>

        <label class="checkbox-label">
          <input
            type="checkbox"
            [checked]="musicEnabled"
            (change)="setMusicEnabled($any($event.target).checked)"
          />
          {{ 'SETTINGS_ENABLED' | translate }}
        </label>

        <input
          type="range"
          min="0"
          max="1"
          step="0.01"
          [value]="musicVolume"
          (input)="setMusicVolume(+$any($event.target).value)"
        />

        <span>{{ (musicVolume * 100) | number:'1.0-0' }}%</span>
      </div>

      <!-- Sound Effects -->
      <div class="setting-group">
        <label class="setting-label">{{ 'SETTINGS_SOUND_EFFECTS' | translate }}</label>

        <label class="checkbox-label">
          <input
            type="checkbox"
            [checked]="sfxEnabled"
            (change)="setSfxEnabled($any($event.target).checked)"
          />
          {{ 'SETTINGS_ENABLED' | translate }}
        </label>

        <input
          type="range"
          min="0"
          max="1"
          step="0.01"
          [value]="sfxVolume"
          (input)="setSfxVolume(+$any($event.target).value)"
        />

        <span>{{ (sfxVolume * 100) | number:'1.0-0' }}%</span>
      </div>

    </div>
  </div>
</div>
