<div class="alert-window overlay-backdrop" (click)="close()" *ngIf="isOpen">
    <div class="alert-container panel" (click)="$event.stopPropagation()">

    <h2 class="title">{{ 'ALERT_SECTION_TITLE' | translate }}</h2>

    <p class="text">{{ message }}</p>

    <button (click)="close()">{{ 'ALERT_SECTION_ACCEPT' | translate }}</button>
    </div>
</div>
